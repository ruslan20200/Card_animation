{% extends "base.html" %}

{% block title %}Валюта брондау - Ақша айырбастау{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card-custom">
                <h2 class="text-center fw-bold mb-4">Валюта <span class="text-accent">брондау</span></h2>
                <p class="text-center text-secondary mb-4">Өзіңізге ыңғайлы бағамды бекіту үшін форманы толтырыңыз. Брондау 1 сағат бойы жарамды.</p>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="{{ form.client_name.id_for_label }}" class="form-label">{{ form.client_name.label }}</label>
                        <input type="text" name="client_name" id="{{ form.client_name.id_for_label }}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.phone_number.id_for_label }}" class="form-label">{{ form.phone_number.label }}</label>
                        <input type="text" name="phone_number" id="{{ form.phone_number.id_for_label }}" class="form-control" placeholder="+7 (___) ___-__-__" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.source_currency.id_for_label }}" class="form-label">{{ form.source_currency.label }}</label>
                            <select name="source_currency" id="{{ form.source_currency.id_for_label }}" class="form-select" required>
                                {% for choice in form.source_currency.field.queryset %}
                                    <option value="{{ choice.pk }}" {% if form.source_currency.value|add:"0" == choice.pk|add:"0" %}selected{% endif %}
                                            data-buy="{{ choice.buy_rate }}" data-sell="{{ choice.sell_rate }}">
                                        {{ choice.code }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.operation_type.id_for_label }}" class="form-label">{{ form.operation_type.label }}</label>
                            <select name="operation_type" id="{{ form.operation_type.id_for_label }}" class="form-select" required>
                                {% for val, label in form.operation_type.field.choices %}
                                    <option value="{{ val }}" {% if form.operation_type.value == val %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.amount_to_exchange.id_for_label }}" class="form-label">{{ form.amount_to_exchange.label }}</label>
                        <input type="number" step="0.01" name="amount_to_exchange" id="{{ form.amount_to_exchange.id_for_label }}" class="form-control" required>
                    </div>

                    <div class="mb-4 p-3 rounded bg-dark border border-secondary text-center">
                        <label class="text-secondary small d-block mb-1">Сен алатын сома (шамамен):</label>
                        <h3 class="mb-0 text-accent fw-bold"><span id="expected-result">0.00</span> ₸</h3>
                        <input type="hidden" name="expected_amount" id="{{ form.expected_amount.id_for_label }}" value="0.00">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-accent btn-lg">Брондауды растау</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const amountInput = document.getElementById('{{ form.amount_to_exchange.id_for_label }}');
    const currencySelect = document.getElementById('{{ form.source_currency.id_for_label }}');
    const operationSelect = document.getElementById('{{ form.operation_type.id_for_label }}');
    const resultSpan = document.getElementById('expected-result');
    const hiddenExpected = document.getElementById('{{ form.expected_amount.id_for_label }}');

    function calculateReservation() {
        const amount = parseFloat(amountInput.value) || 0;
        const selectedOption = currencySelect.options[currencySelect.selectedIndex];
        if (!selectedOption) return;

        const operation = operationSelect.value;
        const rate = (operation === 'buy') ? parseFloat(selectedOption.dataset.buy) : parseFloat(selectedOption.dataset.sell);

        const result = (amount * rate).toFixed(2);
        resultSpan.innerText = parseFloat(result).toLocaleString('kk-KZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        hiddenExpected.value = result;
    }

    amountInput.addEventListener('input', calculateReservation);
    currencySelect.addEventListener('change', calculateReservation);
    operationSelect.addEventListener('change', calculateReservation);

    // Initial calculation
    window.addEventListener('load', calculateReservation);
</script>
{% endblock %}
