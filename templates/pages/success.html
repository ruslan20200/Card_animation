{% extends "base.html" %}

{% block title %}Тапсырыс қабылданды - Азық-түлік дүкені{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 py-5">
            <div class="mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="currentColor" class="bi bi-check-circle-fill text-success" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                </svg>
            </div>
            <h1 class="fw-bold mb-3">Тапсырыс қабылданды!</h1>
            <p class="lead mb-4 text-muted">Тапсырысыңыз үшін рахмет! Жақын арада біздің оператор сізбен байланысады.</p>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a href="{% url 'home' %}" class="btn btn-success btn-lg px-4 gap-3">Басты бетке</a>
                <a href="{% url 'catalog' %}" class="btn btn-outline-secondary btn-lg px-4">Каталогқа</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
