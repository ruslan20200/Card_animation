{% extends "base.html" %}
{% block title %}Авторлар - Кітапхана{% endblock %}

{% block content %}
<div class="container my-5 text-center">
    <h1 class="fw-bold mb-5">Біздің авторлар</h1>
    <div class="row">
        {% for author in authors %}
        <div class="col-md-4 mb-4">
            <div class="card border-0 shadow-sm">
                <img src="{{ author.photo_url }}" class="card-img-top author-photo rounded-top" alt="{{ author.full_name }}">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">{{ author.full_name }}</h5>
                    <a href="{{ author.get_absolute_url }}" class="btn btn-outline-success">Толығырақ көру</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
