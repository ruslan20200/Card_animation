{% load static %}
<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ақша айырбастау{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark-custom py-3">
            <div class="container">
                <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                    <span class="text-accent">АҚША</span> АЙЫРБАСТАУ
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Басты бет</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'rates' %}">Валюталар бағамы</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">Біз туралы</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Байланыс</a></li>
                        <li class="nav-item ms-lg-3">
                            <a class="btn btn-accent px-4" href="{% url 'reserve' %}">Валюта брондау</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="py-4 bg-dark-custom text-light mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; {% now "Y" %} Ақша айырбастау. Барлық құқықтар қорғалған.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}
    {% endblock %}
</body>
</html>
